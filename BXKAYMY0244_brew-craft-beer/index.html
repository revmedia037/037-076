  <script>
    // Jackpot Increment Script
    let value = 989870273;
    const countdownElement = document.getElementById("result");

    function updateJackpot() {
      value++;
      countdownElement.textContent = (value / 100).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    window.setInterval(updateJackpot, 10);

    // Fixed Countdown Timer Script (4 Minutes)
    function startCountdown(durationInSeconds) {
      let timer = durationInSeconds;
      const counterElement = document.getElementById("counter");

      const timerInterval = setInterval(() => {
        const minutes = Math.floor(timer / 60);
        const seconds = timer % 60;

        counterElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if (--timer < 0) {
          clearInterval(timerInterval);
          counterElement.textContent = "0:00";
        }
      }, 1000);
    }

    startCountdown(240); // 4 minutes
  </script>
